<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Merma (temporal)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2933;--mut:#617080;--line:#d8dee6;--acc:#0b5cab;--accbg:#e6f0fb;--pt:#2f7d4f;--m1:#e0a526;--m2:#d8742b;--m3:#b8433a;--m4:#7a4fa3;--nr:#8a94a0;--bad:#b42318;--badbg:#fdecea;--okbg:#e5f4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222b;--ink:#e6eaef;--mut:#9aa7b4;--line:#2f3a46;--acc:#6aaef0;--accbg:#1d3147;--badbg:#3a1c1a;--okbg:#17301f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222b;--ink:#e6eaef;--mut:#9aa7b4;--line:#2f3a46;--acc:#6aaef0;--accbg:#1d3147;--badbg:#3a1c1a;--okbg:#17301f;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap;width:100%}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.del{color:var(--bad)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--mut)}details[open]>summary::before{content:"▾"}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
label input,label select{min-width:110px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accbg);color:var(--acc)}
.b.ok{background:var(--okbg);color:var(--pt)}.b.bad{background:var(--badbg);color:var(--bad)}
.bar{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--line);margin:8px 0}
.bar i{display:block;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.leg s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;text-decoration:none}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mut{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:9;max-width:90%}
textarea{width:100%;min-height:120px;font:12px monospace}
</style>
</head>
<body>
<header><h1>⚖️ Control de Merma <span class="mut">· temporal</span></h1><button id="theme" title="Tema">🌓</button>
<nav id="nav"></nav></header>
<main id="app"></main>
<script>
/*CALC*/
const N=x=>{const n=parseFloat(String(x??'').replace(/,/g,''));return isFinite(n)?n:0};
const sumM=(b,k)=>((b.m&&b.m[k])||[]).reduce((a,r)=>a+N(r.kg),0);
function calc(b){const c=b.calc||{},w=N(b.cantidad),wcaja=N(c.paq)*N(c.pz)*N(c.wsu)/1000;
 const pt=N(c.ptm)>0?N(c.ptm):N(c.cajas)*wcaja,m=['m1','m2','m3','m4'].map(k=>sumM(b,k));
 const mrep=m.reduce((a,x)=>a+x,0),mtot=w-pt,norep=mtot-mrep,p=x=>w>0?x/w*100:0;
 const st=(w<=0||pt<=0)?'incompleto':(norep<-0.005?'revisar':'ok');
 return{w,wcaja,pt,m,mrep,mtot,norep,ppt:p(pt),pm:m.map(p),pmrep:p(mrep),pmtot:p(mtot),pnorep:p(norep),st}}
/*ENDCALC*/
/*IMPORT*/
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const COLS={cantidad:'cantidad',iddocument:'id_contpaq',iddocumento:'id_contpaq',categoria:'categoria',clave:'clave',lote:'lote',fecha:'fecha',titulo:'ot'};
function toDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
 if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
 const s=String(v??'').trim(),m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:s.slice(0,10)}
const keyOf=r=>JSON.stringify([N(r.cantidad).toFixed(4),r.id_contpaq,r.categoria,r.clave,r.lote,r.fecha,r.ot].map(x=>String(x).trim().toLowerCase()));
function mapRows(rows,claves,existing,regla){const allow=claves.map(c=>c.trim().toLowerCase()).filter(Boolean),ini=String(regla?.inicia||'').trim().toLowerCase(),con=String(regla?.contiene||'').trim().toLowerCase();
 const seen=new Set(existing.map(keyOf)),lotes=new Set(existing.map(r=>String(r.lote).trim().toLowerCase()));
 const out={add:[],dup:0,filt:0,neg:0,rev:0,cols:new Set(),ej:[],keys:[]};
 const colmap={},has=f=>Object.values(colmap).includes(f),keys=Object.keys(rows[0]||{});out.keys=keys;
 keys.forEach(k=>{const f=COLS[norm(k)];if(f&&!has(f))colmap[k]=f});
 keys.forEach(k=>{if(colmap[k])return;const n=norm(k),f=(n.includes('iddoc')||n==='documento')?'id_contpaq':n.includes('categor')?'categoria':n.startsWith('clave')?'clave':n.includes('lote')?'lote':n.startsWith('fecha')?'fecha':n.includes('titulo')?'ot':n.startsWith('cant')?'cantidad':'';if(f&&!has(f))colmap[k]=f});
 for(const row of rows){const r={cantidad:0,id_contpaq:'',categoria:'',clave:'',lote:'',fecha:'',ot:''};
  for(const k in colmap){const f=colmap[k];out.cols.add(f);let v=row[k];
   if(f==='cantidad'){const n=N(v);if(n<0)out.neg++;v=Math.abs(n)}else if(f==='fecha')v=toDate(v);else v=String(v??'').trim();r[f]=v}
  if(!r.lote&&!r.cantidad)continue;
  {const cl=String(r.clave).trim().toLowerCase(),tx=Object.values(row).filter(v=>typeof v==='string').join(' ').toLowerCase(),pass=allow.includes(cl)||((ini||con)&&(!ini||cl.startsWith(ini))&&(!con||tx.includes(con)));if((allow.length||ini||con)&&!pass){out.filt++;if(out.ej.length<4&&!out.ej.includes(r.clave))out.ej.push(r.clave);continue}}
  const k=keyOf(r);if(seen.has(k)){out.dup++;continue}seen.add(k);
  r.rev=lotes.has(String(r.lote).trim().toLowerCase());if(r.rev)out.rev++;lotes.add(String(r.lote).trim().toLowerCase());out.add.push(r)}
 return out}
/*ENDIMPORT*/
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),KEY='cm_temp_v1',f2=x=>N(x).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),fmtD=s=>{const m=String(s).match(/^(\d{4})-(\d\d)-(\d\d)/);return m?`${m[3]}/${m[2]}/${m[1]}`:s||''};
const newB=r=>({id:uid(),turno:'',operador:'',maquina:'',estado:'proceso',m:{m1:[],m2:[],m3:[],m4:[]},calc:{paq:'',pz:'',wsu:'',cajas:'',ptm:''},...r});
let S=(()=>{try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.salidas)return x}catch(e){}return{tintas:[],salidas:[],claves:[],conceptos:['Arranque','Cambio de rollo','Ajuste de máquina','Mala impresión']}})();
const U={tab:'tintas',sub:'orden',open:new Set(),f:{q:'',estado:'todas',op:'',maq:'',d1:'',d2:''},msg:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rg=()=>S.regla||(S.regla={inicia:'CUP',contiene:'SBS'}),isReal=s=>!(s.manual&&!s.lote&&!N(s.cantidad));
const AREAS=[['m1','M1 Impresión','--m1'],['m2','M2 Suajado','--m2'],['m3','M3 Desbarbe','--m3'],['m4','M4 Formado','--m4']];
let DL=null;(async()=>{try{DL=await window.claude?.use('downloads')}catch(e){}})();
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
async function out(name,buf,mime){if(DL){try{await DL.save({filename:name,data:buf});return}catch(e){if(e&&e.code==='declined')return}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:mime}));a.download=name;a.click();toast('Si no se descargó, usa la copia en la pestaña Datos')}catch(e){toast('No se pudo descargar aquí')}}
/* ---------- vistas ---------- */
const TABS=[['tintas','Tintas'],['salidas','Salidas'],['bobinas','Bobinas'],['stats','Estadísticas'],['datos','Datos']];
function render(){$('#nav').innerHTML=TABS.map(([k,t])=>`<button class="${U.tab===k?'on':''}" data-act="tab" data-v="${k}">${t}</button>`).join('');
 $('#app').innerHTML=({tintas:vTintas,salidas:vSalidas,bobinas:vBobinas,stats:vStats,datos:vDatos})[U.tab]()}
const tandas=()=>{const g={};return[...S.tintas].sort((a,b)=>(a.fecha+a.id).localeCompare(b.fecha+b.id)).map(t=>(g[t.ot]=(g[t.ot]||0)+1,{...t,n:g[t.ot]}))};
function vTintas(){const T=tandas().reverse();
 return`<div class="card"><b>Nueva entrega de tintas</b><div class="row" style="margin-top:8px">
 <label>Fecha<input type="date" id="t_f" value="${today()}"></label><label>Orden de trabajo<input id="t_ot" placeholder="5859"></label>
 <label>Órdenes entregadas<input id="t_n" type="number" min="0" placeholder="10"></label><label>Observaciones<input id="t_o"></label>
 <button class="pri" data-act="addT">Agregar</button></div><p class="mut">Si una orden recibe otra entrega otro día, se registra como una tanda nueva.</p></div>
 <div class="card tw"><table><tr><th>Fecha</th><th>Orden</th><th>Tanda</th><th class="n">Entregadas</th><th>Observaciones</th><th></th></tr>
 ${T.map(t=>U.editT===t.id?`<tr><td><input type="date" id="e_f" value="${t.fecha}"></td><td><input id="e_ot" value="${esc(t.ot)}" style="min-width:80px"></td><td>#${t.n}</td><td><input id="e_n" type="number" min="0" value="${t.entregadas}" style="min-width:70px"></td><td><input id="e_o" value="${esc(t.obs)}"></td><td><button class="pri" data-act="saveT" data-id="${t.id}">Guardar</button> <button data-act="cancelT">Cancelar</button></td></tr>`:`<tr><td>${fmtD(t.fecha)}</td><td>${esc(t.ot)}</td><td>#${t.n}</td><td class="n">${t.entregadas}</td><td>${esc(t.obs)}</td><td><button data-act="editT" data-id="${t.id}" title="Editar">✎</button> <button class="del" data-act="delT" data-id="${t.id}">✕</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Sin entregas registradas</td></tr>'}</table></div>`}
function vSalidas(){const sub=U.sub,sal=S.salidas;
 const imp=`<details class="card" ${sal.length?'':'open'}><summary>Importar salidas desde Excel</summary><div class="row" style="margin-top:8px">
 <label>Archivo (.xlsx, .xls, .csv)<input type="file" id="f_xlsx" accept=".xlsx,.xls,.csv"></label></div>
 <p class="mut">Se leen: Cantidad, Id document, Categoría, Clave, Lote, Fecha y Título. Se quitan duplicados exactos y las cantidades negativas pasan a positivo.${(()=>{const r=rg(),p=[r.inicia&&'empieza con '+r.inicia,r.contiene&&'contiene '+r.contiene].filter(Boolean);return p.length||S.claves.length?` <b>Solo se importan salidas cuya clave ${p.join(' y ')}${S.claves.length?(p.length?', más las de la lista exacta':'esté en la lista exacta'):''}.</b>`:' <b>Sin filtro de clave: se importan todas.</b>'})()}</p>${U.msg?`<p><b>${U.msg}</b></p>`:''}</details>`;
 const nav=[['orden','Con orden'],['sin','Sin orden'],['todo','Concentrado']].map(([k,t])=>`<button class="${sub===k?'on':''}" data-act="sub" data-v="${k}">${t}</button>`).join(' ');
 let body='';
 if(sub==='orden'){const T=tandas(),ots=[...new Set([...T.map(t=>t.ot),...sal.filter(s=>s.ot).map(s=>s.ot)])].sort();
  body=ots.map(ot=>{const ts=T.filter(t=>t.ot===ot),ent=ts.reduce((a,t)=>a+N(t.entregadas),0),bs=sal.filter(s=>s.ot===ot),real=bs.filter(isReal).length,pend=ent-real,faltan=Math.max(0,ent-bs.length);
   return`<details class="card" data-key="o${esc(ot)}" ${U.open.has('o'+ot)?'open':''}><summary>OT ${esc(ot)} <span class="b">entregadas ${ent}</span> <span class="b">salidas ${real}</span> <span class="b ${pend>0?'bad':'ok'}">pendientes ${pend}</span></summary>
   <p class="mut">Tandas: ${ts.map(t=>`#${t.n} ${fmtD(t.fecha)} (${t.entregadas})`).join(' · ')||'sin tintas'}</p>${faltan>0?`<button class="pri" data-act="crearPend" data-ot="${esc(ot)}" data-n="${faltan}">Crear ${faltan} registros para llenar</button>`:''}${bs.map(card).join('')}</details>`}).join('')||'<p class="mut">Sin órdenes todavía.</p>'}
 else if(sub==='sin')body=`<div class="card">${tbl(sal.filter(s=>!s.ot))}</div>`;
 else body=`<div class="card"><input placeholder="Buscar lote, orden, clave…" data-act="q2" value="${esc(U.q2||'')}">${tbl(sal.filter(s=>!U.q2||JSON.stringify(s).toLowerCase().includes(U.q2.toLowerCase())),1)}</div>`;
 return imp+`<div class="row" style="margin-bottom:10px">${nav}</div>`+body+`<datalist id="dl_c">${S.conceptos.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
function tbl(L,full){const rows=L.map(s=>{const c=calc(s);return`<tr><td>${fmtD(s.fecha)}</td><td>${esc(s.ot)||'—'}</td><td>${esc(s.lote)}${s.rev?' <span class="b bad" title="Lote repetido con datos distintos">repetido</span>':''}</td><td>${esc(s.clave)}</td>
 ${full?`<td>${esc(s.categoria)}</td><td>${esc(s.id_contpaq)}</td><td>${esc(s.turno)}</td><td>${esc(s.operador)}</td><td>${esc(s.maquina)}</td>`:''}<td class="n">${f2(s.cantidad)}</td>
 ${full?c.m.map(x=>`<td class="n">${x?f2(x):''}</td>`).join(''):''}<td><span class="b ${s.estado==='terminada'?'ok':''}">${s.estado==='terminada'?'Terminada':'En proceso'}</span></td></tr>`}).join('');
 return`<div class="tw"><table><tr><th>Fecha</th><th>Orden</th><th>Lote</th><th>Clave</th>${full?'<th>Categoría</th><th>ID Contpaq</th><th>Turno</th><th>Operador</th><th>Máquina</th>':''}<th class="n">Kg</th>${full?'<th class="n">M1</th><th class="n">M2</th><th class="n">M3</th><th class="n">M4</th>':''}<th>Estado</th></tr>${rows||'<tr><td colspan=14 class="mut">Sin registros</td></tr>'}</table></div>`}
function filt(){const f=U.f,q=f.q.toLowerCase();return S.salidas.filter(s=>(f.estado==='todas'||s.estado===f.estado)&&(!f.op||s.operador===f.op)&&(!f.maq||s.maquina===f.maq)&&(!f.d1||s.fecha>=f.d1)&&(!f.d2||s.fecha<=f.d2)&&(!q||[s.lote,s.ot,s.clave,s.id_contpaq].join(' ').toLowerCase().includes(q)))}
function vBobinas(){const f=U.f,ops=[...new Set(S.salidas.map(s=>s.operador).filter(Boolean))],mqs=[...new Set(S.salidas.map(s=>s.maquina).filter(Boolean))],L=filt();
 const opt=(a,v)=>`<option value="">Todos</option>`+a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
 return`<details class="card"><summary>Filtros <span class="mut">(${L.length} de ${S.salidas.length})</span></summary><div class="row" style="margin-top:8px">
 <label>Buscar<input data-f="q" value="${esc(f.q)}" placeholder="lote, orden, clave"></label>
 <label>Estado<select data-f="estado"><option value="todas">Todas</option><option value="proceso" ${f.estado==='proceso'?'selected':''}>En proceso</option><option value="terminada" ${f.estado==='terminada'?'selected':''}>Terminadas</option></select></label>
 <label>Operador<select data-f="op">${opt(ops,f.op)}</select></label><label>Máquina<select data-f="maq">${opt(mqs,f.maq)}</select></label>
 <label>Desde<input type="date" data-f="d1" value="${f.d1}"></label><label>Hasta<input type="date" data-f="d2" value="${f.d2}"></label></div></details>
 <div class="row" style="margin-bottom:10px"><button class="pri" data-act="pdfEntrega">PDF entrega de terminadas</button><span class="mut">Incluye las terminadas del filtro actual.</span></div>
 ${L.map(card).join('')||'<p class="mut">No hay bobinas con este filtro.</p>'}
 <datalist id="dl_c">${S.conceptos.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
function card(s){const c=calc(s),k='b'+s.id,inp=(p,l,t='text',w='')=>`<label>${l}<input ${t==='number'?'type="number" step="any"':''} data-id="${s.id}" data-p="${p}" value="${esc(p.split('.').reduce((o,x)=>o?.[x],s))}" ${w}></label>`;
 return`<details class="card" data-key="${k}" ${U.open.has(k)?'open':''}><summary>${esc(s.lote)||'Registro sin lote'} <span class="mut">OT ${esc(s.ot)||'—'} · ${f2(s.cantidad)} kg${s.fecha_completo?' · completa '+fmtD(s.fecha_completo):''}</span>
 <span class="b ${s.estado==='terminada'?'ok':''}">${s.estado==='terminada'?'Terminada':'En proceso'}</span><span class="b ${c.st==='ok'?'ok':c.st==='revisar'?'bad':''}">${c.st==='ok'?'Cuadra':c.st==='revisar'?'Revisar':'Faltan datos'}</span></summary>
 <details data-key="d${s.id}" ${(U.open.has('d'+s.id)||!s.lote||!N(s.cantidad))?'open':''} style="margin:8px 0"><summary class="mut">Datos de la salida (editar)</summary><div class="row" style="margin-top:6px">${inp('lote','Lote')}${inp('ot','Orden de trabajo')}${inp('clave','Clave')}${inp('categoria','Categoría')}${inp('id_contpaq','ID Contpaq')}<label>Fecha<input type="date" data-id="${s.id}" data-p="fecha" value="${esc(s.fecha)}"></label>${inp('cantidad','Peso de la bobina (kg)','number')}</div></details>
 <div class="row" style="margin:10px 0">${inp('turno','Turno')}${inp('operador','Operador')}${inp('maquina','Máquina')}</div>
 <b>Datos para el cálculo</b><div class="row" style="margin:6px 0 10px">${inp('calc.paq','Paquetes por caja','number')}${inp('calc.pz','Piezas por paquete','number')}${inp('calc.wsu','W suaje (g/pieza)','number')}${inp('calc.cajas','Cajas','number')}${inp('calc.ptm','PT manual kg (opcional)','number')}</div>
 <b>Merma por área</b><div class="g2" style="margin:6px 0 10px">${AREAS.map(([a,t,col])=>`<div><div class="mut"><s style="background:var(${col});display:inline-block;width:10px;height:10px;border-radius:2px"></s> ${t}: <b>${f2(sumM(s,a))} kg</b></div>

 d.setFont('helvetica','normal').setFontSize(9);seg.forEach(([v,k,l],i)=>{const cx=ml+(i%2)*(cw/2),cy=y+Math.floor(i/2)*15;d.setFillColor(...RGB[k]).rect(cx,cy-8,9,9,'F');d.text(`${l}: ${f2(v)} kg (${f2(pc(v))}%)`,cx+14,cy)});y+=Math.ceil(seg.length/2)*15+14;
 H2('Merma por área');tab(['Área','Kg','% de la bobina','% de la merma reportada'],AREAS.map(([a,x],i)=>[x,f2(t.m[i]),f2(pc(t.m[i])),f2(pc(t.m[i],t.mrep))]),{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}});

  const mx=mol[0][1].kg||1,bw2=cw-250;

  tab(['Motivo','Áreas','Kg','% de la merma','% de la bobina'],mol.map(([k,o])=>[k,[...o.ar].join(', '),f2(o.kg),f2(pc(o.kg,t.mrep)),f2(pc(o.kg))]),{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}})}
 const gr=(k,h)=>{H2(h);tab([k,'Bobinas','Kg','Aprovechado %','Desperdicio %','No reportada %'],grp(h==='Por operador'?'operador':'maquina').map(([n,a])=>[n,a.n,f2(a.w),f2(pc(a.pt,a.w)),f2(pc(a.mrep,a.w)),f2(pc(a.nr,a.w))]),{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}})};
 gr('Operador','Por operador');gr('Máquina','Por máquina');
 d.setFont('helvetica','normal').setFontSize(8).setTextColor(90);need(40);d.text('Aprovechado = producto terminado. Desperdicio = merma reportada (M1 a M4). No reportada = peso de la bobina menos producto terminado menos merma reportada. Porcentajes sobre el peso de las bobinas.',ml,y,{maxWidth:cw});d.setTextColor(0);
 const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal').setFontSize(8).setTextColor(120).text(`Página ${i} de ${n}`,W-ml,764,{align:'right'})}

const setP=(o,p,v)=>{const a=p.split('.');a.slice(0,-1).forEach(k=>o=o[k]);o[a.at(-1)]=v};

document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id,b=S.salidas.find(s=>s.id===id);if(a==='delC')e.preventDefault();
 if(a==='tab'){U.tab=t.dataset.v}else if(a==='sub'){U.sub=t.dataset.v}
 else if(a==='addT'){const ot=$('#t_ot').value.trim(),n=N($('#t_n').value);if(!ot||!n)return toast('Captura orden y cantidad entregada');S.tintas.push({id:uid(),fecha:$('#t_f').value||today(),ot,entregadas:n,obs:$('#t_o').value.trim()})}
 else if(a==='crearPend'){const ot=t.dataset.ot,n=+t.dataset.n;for(let i=0;i<n;i++)S.salidas.push(newB({cantidad:'',ot,lote:'',clave:'',categoria:'',id_contpaq:'',fecha:today(),manual:true}))}
 else if(a==='delT')S.tintas=S.tintas.filter(x=>x.id!==id);
 else if(a==='editT')U.editT=id;else if(a==='cancelT')U.editT=null;
 else if(a==='saveT'){const ot=$('#e_ot').value.trim(),n=N($('#e_n').value),x=S.tintas.find(z=>z.id===id);if(!ot||!n)return toast('Captura orden y cantidad entregada');Object.assign(x,{fecha:$('#e_f').value||x.fecha,ot,entregadas:n,obs:$('#e_o').value.trim()});U.editT=null}
 else if(a==='addM')b.m[t.dataset.a].push({kg:'',concepto:''});else if(a==='delM')b.m[t.dataset.a].splice(+t.dataset.i,1);
 else if(a==='toggleE'){b.estado='proceso';delete b.fecha_completo}
 else if(a==='completo'){const c=calc(b);if(c.st!=='ok'&&t.dataset.c!=='1'){t.dataset.c='1';t.textContent=c.st==='incompleto'?'Faltan datos: presiona otra vez para completar':'Los datos no cuadran: presiona otra vez para completar';return}b.estado='terminada';b.fecha_completo=today()}
 else if(a==='delB'){if(t.dataset.c!=='1'){t.dataset.c='1';t.textContent='Confirmar eliminar';return}S.salidas=S.salidas.filter(x=>x.id!==id)}
 else if(a==='pdfBob'){const c0=calc(b);if(c0.st==='incompleto')return toast(c0.w<=0?'Captura el peso de la bobina (Datos de la salida) antes del PDF':'Faltan presentación, W suaje y cajas (o PT manual)');try{await out(`resultado_${String(b.lote).replace(/[^\w.-]+/g,'_')}.pdf`,pdfBob(b).output('arraybuffer'),'application/pdf')}catch(x){toast('Error al generar el PDF')}return}
 else if(a==='pdfEntrega'){const L=filt().filter(s=>s.estado==='terminada');if(!L.length)return toast('No hay bobinas terminadas en el filtro');try{await out(`entrega_${today()}.pdf`,pdfEntrega(L).output('arraybuffer'),'application/pdf')}catch(x){toast('Error al generar el PDF')}return}
 else if(a==='pdfStats'){try{await out(`estadisticas_${today()}.pdf`,pdfStats().output('arraybuffer'),'application/pdf')}catch(x){toast('Error al generar el PDF')}return}
 else if(a==='expJ'){await out(`respaldo_merma_${today()}.json`,JSON.stringify(S,null,1),'application/json');return}
 else if(a==='cpJ'){$('#ta').select();try{await navigator.clipboard.writeText($('#ta').value);toast('JSON copiado')}catch(x){toast('Selecciónalo y copia con Ctrl+C')}return}
 else if(a==='loadJ'){try{const x=JSON.parse($('#ta').value);if(!x.salidas)throw 0;S=x;S.claves=S.claves||[];S.conceptos=S.conceptos||[];S.tintas=S.tintas||[];toast('Datos cargados')}catch(x){return toast('JSON no válido')}}
 else if(a==='saveCl'){S.regla={inicia:$('#rg_i').value.trim(),contiene:$('#rg_c').value.trim()};S.claves=$('#ta_cl').value.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);toast('Claves guardadas')}
 else if(a==='delC')S.conceptos.splice(+t.dataset.i,1);
 else if(a==='seed')seed();
 else if(a==='wipe'){if(!U.wipe){U.wipe=1;render();return}U.wipe=0;S.tintas=[];S.salidas=[]}
 save();render()});

 if(t.id==='f_xlsx'&&t.files[0]){try{const wb=XLSX.read(await t.files[0].arrayBuffer(),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true}),r=mapRows(rows,S.claves,S.salidas,rg());
  r.add.forEach(x=>{const ph=S.salidas.find(s=>s.manual&&!s.lote&&!N(s.cantidad)&&x.ot&&s.ot===x.ot);if(ph)Object.assign(ph,x,{manual:false});else S.salidas.push(newB(x))});const miss=['cantidad','id_contpaq','categoria','clave','lote','fecha','ot'].filter(c=>!r.cols.has(c));
  U.msg=`${r.add.length} nuevas · ${r.dup} duplicadas eliminadas · ${r.filt} descartadas por clave · ${r.neg} negativas pasadas a positivo · ${r.rev} con lote repetido y datos distintos${miss.length?' · No encontré las columnas: '+miss.join(', '):''}${r.filt&&r.ej.length?' · Ejemplos de clave descartada: '+r.ej.map(x=>x||'(vacía)').join(', '):''}${r.add.length?'':' · Columnas del archivo: '+r.keys.join(', ')}`}catch(x){U.msg='No pude leer el archivo'}save();render();return}

 if(t.dataset.p){const b=S.salidas.find(s=>s.id===t.dataset.id);setP(b,t.dataset.p,t.value);if(/concepto$/.test(t.dataset.p)&&t.value&&!S.conceptos.includes(t.value))S.conceptos.push(t.value);save();render()}});
